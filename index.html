<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemonade Co</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Raleway', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .bgimg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://cdn.shopify.com/s/files/1/0336/3763/0092/files/stage-2223130_1920_1024x1024.jpg?v=1629733371');
            height: 100%;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logo {
            position: absolute;
            top: 24px;
            left: 24px;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeIn 1.2s ease-out forwards;
        }

        /* Main Content Container */
        .content {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        /* Animated Heading */
        .content h1 {
            font-size: 4rem;
            font-weight: 300;
            margin-bottom: 15px;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(-30px);
            animation: slideDown 1s ease-out forwards;
        }

        /* Divider Line */
        .divider {
            border: none;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.6);
            width: 40%;
            margin: 0 auto 25px auto;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 0.5s forwards;
        }

        /* Contact Text */
        .contact-info {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            line-height: 1.6;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 0.8s forwards;
        }

        /* Animations */
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive adjustments for mobile screens */
        @media (max-width: 600px) {
            .content h1 {
                font-size: 2.5rem;
            }
            .contact-info {
                font-size: 1rem;
                word-break: break-word;
            }
            .logo {
                top: 15px;
                left: 15px;
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="bgimg">
        <div class="logo">Logo</div>
        
        <div class="content">
            <h1>Contact Me:</h1>
            <hr class="divider">
            <p class="contact-info">frankie@lemonade-co.site &nbsp;|&nbsp; +44 7934 906648</p>
        </div>
    </div>

</body>
</html>
